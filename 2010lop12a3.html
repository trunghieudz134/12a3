<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư gửi 12A3</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff6fa5; --pink2:#ff9ac1; --deep:#c2185b; --sky1:#4fc3f7; --sky2:#b9e8fb;
  --grass1:#8bd36b; --grass2:#5cb85c; --paper:#fffaf0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Quicksand','Baloo 2',sans-serif;color:#37474f;user-select:none}
#stage{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%);overflow:hidden}

/* ===== nền ===== */
.grass{position:absolute;left:-10%;right:-10%;bottom:-6%;height:30%;
  background:linear-gradient(180deg,var(--grass1),var(--grass2));
  border-radius:50% 50% 0 0/28% 28% 0 0;z-index:1}
.cloud{position:absolute;width:110px;height:36px;background:#fff;border-radius:40px;opacity:.95;z-index:0;
  animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;left:16px;top:-24px}
.cloud::after{width:38px;height:38px;right:18px;top:-16px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}
.flower{position:absolute;z-index:2;font-size:16px;animation:sway 3s ease-in-out infinite;pointer-events:none}
@keyframes sway{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.15)}}
.butterfly{position:absolute;font-size:22px;z-index:3;pointer-events:none;animation:fly 12s ease-in-out infinite}
@keyframes fly{
  0%{transform:translate(0,0) rotate(0)}25%{transform:translate(60px,-40px) rotate(10deg)}
  50%{transform:translate(120px,10px) rotate(-8deg)}75%{transform:translate(40px,40px) rotate(6deg)}100%{transform:translate(0,0) rotate(0)}}
.petal{position:absolute;top:-30px;z-index:4;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

/* ===== cảnh ===== */
/* màn hình lớn (PC/TV): --s phóng to toàn bộ nội dung; màn hình thấp (điện thoại nằm ngang): cuộn dọc được, không bị cắt mất tiêu đề/nút */
.scene,.flower,.butterfly,.cloud,.petal,.hint{zoom:var(--s,1)}
.scene{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scene::-webkit-scrollbar{display:none}
.scene{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
  gap:18px;padding:20px 20px 12vh;opacity:0;visibility:hidden;transform:scale(.92) translateY(20px);
  transition:opacity .6s,transform .6s,visibility .6s}
.scene.active{opacity:1;visibility:visible;transform:none}
.scene.leaving{opacity:0;transform:scale(1.08)}
h1{font-family:'Pacifico',cursive;font-weight:400;color:#fff;font-size:clamp(26px,6vw,44px);text-align:center;
  text-shadow:0 3px 0 var(--deep),0 6px 14px rgba(0,0,0,.25);line-height:1.3}
.sub{color:#fff;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.35);text-align:center;font-size:clamp(13px,3.4vw,17px)}
.btn{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(15px,4vw,19px);letter-spacing:.5px;color:#fff;
  border:3px solid #fff;border-radius:40px;padding:12px 30px;cursor:pointer;
  background:linear-gradient(180deg,var(--pink2),var(--pink));box-shadow:0 6px 0 var(--deep),0 10px 20px rgba(0,0,0,.25);
  transition:transform .15s,box-shadow .15s;animation:pulse 1.6s ease-in-out infinite}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--deep)}
.btn[disabled]{filter:grayscale(.7);opacity:.7;cursor:default;animation:none}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ===== 1. phong bì ===== */
.envelope{position:relative;width:170px;height:118px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.env-body{position:absolute;inset:0;background:linear-gradient(180deg,#fff,#ffe3ef);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.25);border:2px solid #fff}
.env-flap{position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(180deg,#fff,#ffd3e5);
  clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0;transform-origin:top;transition:transform .8s}
.env-heart{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);font-size:34px;animation:beat 1s infinite}
@keyframes beat{50%{transform:translate(-50%,-30%) scale(1.25)}}
.wing{position:absolute;top:20px;width:56px;height:34px;background:#fff;border-radius:50% 50% 50% 8%;opacity:.9;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.wing.l{left:-44px;transform-origin:right center;animation:flapL .5s ease-in-out infinite alternate}
.wing.r{right:-44px;transform:scaleX(-1);transform-origin:right center;animation:flapR .5s ease-in-out infinite alternate}
@keyframes flapL{to{transform:rotate(-25deg)}}
@keyframes flapR{from{transform:scaleX(-1) rotate(0)}to{transform:scaleX(-1) rotate(-25deg)}}
.bar{width:min(260px,70vw);height:12px;border-radius:12px;background:rgba(255,255,255,.55);overflow:hidden;border:2px solid #fff}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:12px;animation:load 3s linear forwards}
@keyframes load{to{width:100%}}
.loadtxt{color:var(--deep);font-weight:800;font-size:15px;text-shadow:0 1px 0 #fff}

/* ===== 2. vòng tròn lớp ===== */
.ring{position:relative;flex:none;width:max(300px,min(94vw,60vh,560px));aspect-ratio:1}
.card{position:absolute;width:var(--w,64px);transform:translate(-50%,-50%) scale(0);background:#fff;border-radius:10px;
  padding:4px 3px 5px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.25);
  animation:pop .5s forwards;border:2px solid #ffd3e5;cursor:pointer}
.card .av{font-size:var(--af,24px);line-height:1;height:var(--ah,30px);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.card .av img{width:var(--ah,30px);height:var(--ah,30px);border-radius:50%;object-fit:cover;border:2px solid var(--pink2)}
/* tên đầy đủ: tự xuống dòng, không cắt chữ */
.card .nm{font-size:var(--nf,9.5px);line-height:1.15;font-weight:700;color:#455a64;white-space:normal;overflow-wrap:anywhere}
.card.zoom{z-index:20;width:150px!important;animation:none;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.card.zoom .nm{font-size:14px}
.card.teacher{width:clamp(70px,20%,110px);border-color:var(--pink);background:#fff0f6;z-index:2}
.card.teacher{width:clamp(84px,24%,120px);padding:6px 4px 7px}
.card.teacher .av{font-size:clamp(30px,8vw,44px);height:clamp(40px,10vw,56px);margin-bottom:4px}
.card.teacher .nm{color:var(--deep);font-size:clamp(11px,2.8vw,14px);line-height:1.2}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
.card:hover{z-index:5;animation:none;transform:translate(-50%,-50%) scale(1.18) rotate(-4deg);transition:transform .2s}

/* ===== 3. lịch ===== */
.cal{background:#fff;border-radius:22px;padding:16px 16px 14px;width:min(340px,88vw);box-shadow:0 12px 30px rgba(0,0,0,.28);text-align:center}
.cal h3{font-family:'Baloo 2';color:var(--deep);font-size:20px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid b{font-size:12px;color:#90a4ae}
.grid span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border-radius:50%;
  opacity:0;animation:fadein .3s forwards}
.grid span.hot{background:var(--pink);color:#fff;position:relative;animation:fadein .3s forwards,hotpulse 1.2s 1.2s infinite}
.grid span.hot::after{content:"💖";position:absolute;top:-14px;right:-8px;font-size:16px}
@keyframes fadein{to{opacity:1}}
@keyframes hotpulse{50%{transform:scale(1.3);box-shadow:0 0 0 8px rgba(255,111,165,.25)}}
.bigheart{font-size:64px;animation:beat2 1s infinite}
@keyframes beat2{50%{transform:scale(1.2)}}

/* ===== 4. hộp quà ===== */
.gift{position:relative;width:170px;height:150px;margin-top:40px;animation:float 3s ease-in-out infinite}
.gift .box{position:absolute;bottom:0;left:0;right:0;height:100px;background:linear-gradient(180deg,#fff7c2,#ffe27a);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.gift .rib-v{position:absolute;bottom:0;left:50%;width:26px;height:100px;background:var(--pink);transform:translateX(-50%)}
.gift .lid{position:absolute;top:0;left:-8px;right:-8px;height:52px;background:linear-gradient(180deg,#fff0a0,#ffd54f);border-radius:8px;
  transition:transform .8s cubic-bezier(.5,-0.4,.5,1.4);box-shadow:0 4px 10px rgba(0,0,0,.2);z-index:3}
.gift .lid::before{content:"";position:absolute;left:50%;top:0;width:26px;height:100%;background:var(--pink);transform:translateX(-50%)}
.gift .bow{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:44px;z-index:4;transition:transform .8s}
.gift .note{position:absolute;left:50%;top:70px;width:120px;padding:14px 6px;text-align:center;background:var(--paper);border-radius:6px;
  font-family:'Pacifico';font-size:15px;color:var(--deep);transform:translateX(-50%);z-index:2;transition:transform 1s .3s;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.gift.open .lid{transform:translateY(-70px) rotate(-18deg)}
.gift.open .bow{transform:translate(-50%,-90px) rotate(-18deg)}
.gift.open .note{transform:translate(-50%,-100px)}

/* ===== 5. thư ===== */
.letter{width:min(520px,92vw);max-height:68vh;overflow:auto;background:var(--paper);border-radius:12px;padding:24px 22px;
  box-shadow:0 14px 34px rgba(0,0,0,.3);border-left:6px solid var(--pink2);
  background-image:repeating-linear-gradient(transparent 0 29px,#f3d9e3 29px 30px)}
.letter p{font-size:clamp(14px,3.6vw,17px);line-height:30px;color:#5d4037;font-weight:600;min-height:30px}
.letter .sign{text-align:right;font-family:'Pacifico';color:var(--deep)}
.cursor::after{content:"|";animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}

/* ===== 6. slide ảnh ===== */
/* khung CỐ ĐỊNH kích thước → đổi ảnh không bị giật bố cục; chỉ dùng opacity/transform (chạy GPU, mượt) */
.frame{position:relative;width:min(92vw,560px);height:min(54vh,calc(92vw*.72),400px);background:#fff;padding:10px;border-radius:14px;
  box-shadow:0 14px 34px rgba(0,0,0,.35);transform:rotate(-1.5deg);touch-action:pan-y;contain:layout paint}
.pic{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#e8f4fb}
.sl{position:absolute;inset:0;opacity:0;transform:translate3d(6%,0,0) scale(.97);will-change:opacity,transform;
  transition:opacity .55s ease,transform .55s cubic-bezier(.22,.8,.3,1);pointer-events:none}
.sl.on{opacity:1;transform:none}
.sl.out{opacity:0;transform:translate3d(-6%,0,0) scale(.97)}
.sl .bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(18px) brightness(.9);transform:translateZ(0)}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s}
.sl img.ok{opacity:1}
.sl .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;
  background:linear-gradient(135deg,#ffd6e8,#cfe9ff)}
.cap{color:#fff;font-weight:800;text-align:center;font-size:clamp(14px,3.8vw,19px);text-shadow:0 2px 8px rgba(0,0,0,.6);
  background:rgba(0,0,0,.28);padding:8px 18px;border-radius:30px;max-width:92vw;min-height:38px;transition:opacity .3s}
.cap.fade{opacity:0}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);transition:transform .3s,background .3s}.dots i.on{background:var(--pink);transform:scale(1.4)}
/* cảnh ảnh: tạm dừng hoa/cánh rơi để máy yếu không bị giật */
body.lite .flower,body.lite .butterfly,body.lite .cloud{animation-play-state:paused}
body.lite .petal{display:none}

/* ===== 7. kết ===== */
.crowd{display:flex;gap:4px;font-size:clamp(26px,7vw,40px);flex-wrap:wrap;justify-content:center;max-width:92vw}
.crowd span{display:inline-block;animation:jump 1s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-16px)}}
.hint{position:absolute;bottom:2.5vh;left:0;right:0;text-align:center;z-index:6;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5);opacity:.85}
</style>
</head>
<body>
<div id="stage">
  <div class="grass"></div>

  <!-- 1 -->
  <section class="scene" id="s1">
    <div class="envelope">
      <div class="wing l"></div><div class="wing r"></div>
      <div class="env-body"></div><div class="env-flap" id="flap"></div><div class="env-heart">💗</div>
    </div>
    <div class="loadtxt" id="loadtxt">Đang chuẩn bị món quà nhỏ...</div>
    <div class="bar"><i></i></div>
    <button class="btn" id="open" disabled>MỞ PHONG BÌ</button>
  </section>

  <!-- 2 -->
  <section class="scene" id="s2">
    <h1 id="t2"></h1>
    <div class="sub" id="sub2"></div>
    <div class="ring" id="ring"></div>
    <button class="btn next">XEM LỊCH 20/10</button>
  </section>

  <!-- 3 -->
  <section class="scene" id="s3">
    <h1>Tháng 10 Yêu Thương</h1>
    <div class="cal"><h3 id="calTitle"></h3><div class="grid" id="grid"></div></div>
    <button class="btn next">MỞ QUÀ 🎁</button>
  </section>

  <!-- 4 -->
  <section class="scene" id="s4">
    <div class="gift" id="gift">
      <div class="note" id="giftNote"></div>
      <div class="box"><div class="rib-v"></div></div>
      <div class="lid"></div><div class="bow">🎀</div>
    </div>
    <div class="sub" style="margin-top:24px">Có một món quà nhỏ dành cho các nàng 12A3…</div>
    <button class="btn" id="openGift">CHẠM ĐỂ MỞ THƯ</button>
  </section>

  <!-- 5 -->
  <section class="scene" id="s5">
    <h1>Thư gửi các nàng 12A3</h1>
    <div class="letter" id="letter"></div>
    <button class="btn next" id="after5">TIẾP TỤC</button>
  </section>

  <!-- 6 -->
  <section class="scene" id="s6">
    <div class="frame" id="frame"><div class="pic" id="pic"></div></div>
    <div class="cap" id="cap"></div>
    <div class="dots" id="dots"></div>
    <button class="btn" id="nextPic">TIẾP THEO ▶</button>
  </section>

  <!-- 7 -->
  <section class="scene" id="s7">
    <h1 id="t7"></h1>
    <div class="sub" id="sub7"></div>
    <div class="crowd" id="crowd"></div>
    <button class="btn" id="replay">XEM LẠI TỪ ĐẦU</button>
  </section>

  <div class="hint">✦ bấm vào nút để đi tiếp ✦</div>
</div>

<!-- nhạc nền (tuỳ chọn): đặt file mp3 cùng thư mục rồi điền tên vào CONFIG.music -->
<audio id="bgm" loop></audio>

<script>
/* ==========================================================
   ✏️  CHỈNH NỘI DUNG Ở ĐÂY
   ========================================================== */
const CONFIG = {
  className: "12A3",
  teacher: "Cô Thanh Hương",
  teacherEmoji: "👩‍🏫",
  year: 2026, month: 10, day: 20,          // ngày được tô sáng trên lịch
  // ẢNH CHỤP LỚP: dán link ảnh (https://...) hoặc tên file ảnh để cùng thư mục (vd "lop.jpg")
  classPhoto: "",
  // DANH SÁCH CÁC BẠN NỮ: ghi HỌ TÊN ĐẦY ĐỦ (tên dài sẽ tự xuống dòng, không bị cắt).
  // Muốn hiện ảnh chân dung từng bạn: {name:"Nguyễn Thị Lan", photo:"lan.jpg"} (link hoặc file đều được)
  students: [
    "Đỗ Ngọc Anh","Nguyễn Ngọc Anh","Đinh Thảo Anh","Hoàng Bảo Ngọc","Lê Tiểu Ngọc",
    "Nguyễn Minh Anh","Nguyễn Phương Linh","Nguyễn Phương Thanh","Như Quỳnh","Phạm Huệ",
    "Quỳnh Trang","Thanh Hải","Thu An","Phạm Trang","Hà Vân",
    "Khánh Băng","Đoàn Ngọc","Vân Anh","Phương Nga"
  ],
  emojis: ["👧","👩‍🎓","👩"],
  letter: [
    "Gửi các nàng 12A3 xinh đẹp,",
    "Nhân ngày Phụ nữ Việt Nam 20/10, chúc các bạn luôn rạng rỡ, tự tin và thật nhiều niềm vui.",
    "Chúc mỗi người đều được yêu thương đúng cách, khoẻ mạnh, học hành thuận lợi trong năm cuối cấp.",
    "Mong các bạn cười thật nhiều, vì nụ cười của các bạn làm lớp mình đáng nhớ hơn mỗi ngày.",
    "Cũng xin gửi lời chúc 20/10 đến cô Thanh Hương, cô chủ nhiệm của chúng ta nữa nhé 💐",
    "Chúc các nàng 12A3 một mùa 20/10 thật hạnh phúc!",
  ],
  sign: "— Lớp 12A3 —",
  // SLIDE ẢNH: img có thể là link (https://...) hoặc file cùng thư mục; để trống sẽ hiện biểu tượng.
  // (Nếu đã điền classPhoto ở trên thì ảnh lớp tự thành slide đầu tiên.)
  slides: [
    { img:"https://cdn.upanhlaylink.com/i/XtPKabT2.jpg", icon:"🌸", text:"Các nàng 12A3 của chúng mình" },
    { img:"https://cdn.upanhlaylink.com/i/ihpC9cAl.jpg", icon:"📸", text:"Một năm cuối cấp thật nhiều kỷ niệm" },
    { img:"https://cdn.upanhlaylink.com/i/9tjpH5t2.jpg", icon:"💖", text:"Chúc các nàng 20/10 thật hạnh phúc" },
  ],
  finalTitle: "Chúc mừng 20/10!",
  finalSub: "Chúc các nàng 12A3 một ngày 20/10 thật xinh, thật vui 💗",
  music: "nhac2010.mp3"   // vd "nhac.mp3"
};

/* ==========================================================
   Điều khiển cảnh
   ========================================================== */
const $ = s => document.querySelector(s);
const scenes = [...document.querySelectorAll('.scene')];
let cur = -1;
const timers = [];

function go(n){
  if(n === cur) return;
  const prev = scenes[cur];
  if(prev){ prev.classList.add('leaving'); prev.classList.remove('active'); setTimeout(()=>prev.classList.remove('leaving'),650); }
  cur = n;
  setTimeout(()=>{ scenes[n].classList.add('active'); onEnter(n); }, prev ? 350 : 50);
}
document.querySelectorAll('.next').forEach(b=>b.addEventListener('click',()=>go(cur+1)));

/* ===== trang trí nền ===== */
(function decorate(){
  const st = $('#stage');
  for(let i=0;i<4;i++){
    const c = document.createElement('div'); c.className='cloud';
    c.style.top = (6+Math.random()*30)+'%'; c.style.transform='scale('+(.7+Math.random()*.8)+')';
    c.style.animationDuration=(40+Math.random()*40)+'s'; c.style.animationDelay=(-Math.random()*60)+'s';
    st.appendChild(c);
  }
  const fl = ['🌸','🌼','🌷','✨','🌺'];
  for(let i=0;i<46;i++){
    const f = document.createElement('div'); f.className='flower';
    f.textContent = fl[i%fl.length];
    f.style.left=Math.random()*100+'%'; f.style.bottom=(Math.random()*20)+'%';
    f.style.animationDelay=(-Math.random()*3)+'s'; f.style.fontSize=(12+Math.random()*10)+'px';
    st.appendChild(f);
  }
  for(let i=0;i<3;i++){
    const b = document.createElement('div'); b.className='butterfly'; b.textContent='🦋';
    b.style.left=(10+Math.random()*70)+'%'; b.style.top=(35+Math.random()*30)+'%';
    b.style.animationDelay=(-Math.random()*10)+'s'; st.appendChild(b);
  }
  const pet = ['🌸','🌸','💮','🌼','🩷'];
  setInterval(()=>{
    if(document.hidden) return;
    const p = document.createElement('div'); p.className='petal';
    p.textContent = pet[Math.floor(Math.random()*pet.length)];
    p.style.left = Math.random()*100+'%'; p.style.fontSize=(12+Math.random()*12)+'px';
    p.style.setProperty('--dx',(Math.random()*160-80)+'px'); p.style.setProperty('--rot',(Math.random()*540-270)+'deg');
    p.style.animationDuration=(6+Math.random()*6)+'s';
    st.appendChild(p); setTimeout(()=>p.remove(),12500);
  },450);
})();

/* ===== xây nội dung từng cảnh ===== */
function studentInfo(s,i){
  const o = typeof s==='string' ? {name:s} : s;
  return { name:o.name, photo:o.photo||"", emoji:o.emoji||CONFIG.emojis[i%CONFIG.emojis.length] };
}
function buildRing(){
  const ring = $('#ring'); ring.innerHTML='';
  ring.onclick = ()=> ring.querySelectorAll('.zoom').forEach(x=>x.classList.remove('zoom'));
  const list = CONFIG.students.map(studentInfo);
  const sc = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
  const n = list.length, S = (ring.getBoundingClientRect().width / sc) || 340;
  // trên 10 bạn thì xếp 2 vòng (vòng ngoài + vòng trong) để đủ chỗ cho tên đầy đủ
  const two = n > 10, nOut = two ? Math.ceil(n*0.6) : n;
  const rings = two
    ? [{r:.425, inner:false, items:list.slice(0,nOut)}, {r:.225, inner:true, items:list.slice(nOut)}]
    : [{r:.40,  inner:false, items:list}];
  let idx = 0;
  rings.forEach(R=>{
    const m = R.items.length;
    const w  = Math.max(50, Math.min(92, (2*Math.PI*R.r*S/m)*0.9));
    const nf = Math.max(8.5, Math.min(11.5, w/6.4));
    const ah = Math.max(20, Math.min(38, w*0.42));
    R.items.forEach((st,j)=>{
      const a = j/m*Math.PI*2 - Math.PI/2 + (R.inner ? Math.PI/m : 0);
      const el = document.createElement('div'); el.className='card';
      el.style.cssText = `left:${50+R.r*100*Math.cos(a)}%;top:${50+R.r*100*Math.sin(a)}%;--w:${w}px;--nf:${nf}px;--ah:${ah}px;--af:${ah*.8}px;animation-delay:${(idx++*0.08)}s`;
      el.innerHTML = `<div class="av"></div><div class="nm"></div>`;
      const av = el.querySelector('.av');
      if(st.photo){
        const im = new Image(); im.alt=''; im.src = st.photo;
        im.onerror = ()=>{ av.textContent = st.emoji; };
        av.appendChild(im);
      } else av.textContent = st.emoji;
      el.querySelector('.nm').textContent = st.name;   // tên đầy đủ, tự xuống dòng
      el.onclick = e=>{
        e.stopPropagation();
        const was = el.classList.contains('zoom');
        ring.querySelectorAll('.zoom').forEach(x=>x.classList.remove('zoom'));
        if(!was) el.classList.add('zoom');             // bấm vào thẻ để phóng to đọc tên
      };
      ring.appendChild(el);
    });
  });
  const t = document.createElement('div'); t.className='card teacher';
  t.style.left='50%'; t.style.top='50%'; t.style.animationDelay=(n*0.09+.1)+'s';
  t.innerHTML = `<div class="av">${CONFIG.teacherEmoji}</div><div class="nm">${CONFIG.teacher}</div>`;
  ring.appendChild(t);
}
function buildCalendar(){
  const {year,month,day} = CONFIG;
  $('#calTitle').textContent = `Tháng ${month} / ${year}`;
  const g = $('#grid'); g.innerHTML='';
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(d=>{ const b=document.createElement('b'); b.textContent=d; g.appendChild(b); });
  const first = (new Date(year,month-1,1).getDay()+6)%7;
  const total = new Date(year,month,0).getDate();
  for(let i=0;i<first;i++) g.appendChild(document.createElement('span'));
  for(let d=1;d<=total;d++){
    const s=document.createElement('span'); s.textContent=d; s.style.animationDelay=(d*0.04)+'s';
    if(d===day) s.classList.add('hot');
    g.appendChild(s);
  }
}
function typeLetter(){
  const box = $('#letter'); box.innerHTML='';
  $('#after5').disabled = true;
  const lines = CONFIG.letter.concat([CONFIG.sign]);
  let li=0, ci=0, p=null, skip=false, done=false;
  const finish = ()=>{ done=true; box.querySelectorAll('p').forEach(x=>x.classList.remove('cursor')); $('#after5').disabled=false; };
  box.onclick = ()=>{ skip=true; };
  (function tick(){
    if(done || cur!==4) return;
    if(li>=lines.length) return finish();
    if(!p){ p=document.createElement('p'); if(li===lines.length-1) p.className='sign'; p.classList.add('cursor'); box.appendChild(p); }
    const txt = lines[li];
    if(skip){ p.textContent=txt; ci=txt.length; } else { p.textContent = txt.slice(0,++ci); }
    box.scrollTop = box.scrollHeight;
    if(ci>=txt.length){ p.classList.remove('cursor'); p=null; li++; ci=0; timers.push(setTimeout(tick, skip?20:350)); }
    else timers.push(setTimeout(tick, 38));
  })();
}
let slide = 0, slideEls = [], autoT = null;
/* dựng sẵn TẤT CẢ slide + tải trước ảnh 1 lần → chuyển ảnh không phải chờ tải */
function buildSlides(){
  const pic = $('#pic'); pic.innerHTML=''; slideEls=[];
  CONFIG.slides.forEach(s=>{
    const d = document.createElement('div'); d.className='sl';
    const ph = `<div class="ph">${s.icon||'🌸'}</div>`;
    if(s.img){
      d.innerHTML = `<div class="bg"></div>${ph}<img alt="" decoding="async" referrerpolicy="no-referrer">`;
      const im = d.querySelector('img'), bg = d.querySelector('.bg');
      im.onload = ()=>{
        const show = ()=>{ im.classList.add('ok'); d.querySelector('.ph').style.display='none'; bg.style.backgroundImage=`url("${s.img}")`; };
        (im.decode ? im.decode().then(show,show) : show());
      };
      im.onerror = ()=>{ bg.remove(); };            // link lỗi → giữ biểu tượng thay thế
      im.src = s.img;
    } else { d.innerHTML = `<div class="bg" style="display:none"></div>${ph}`; }
    pic.appendChild(d); slideEls.push(d);
  });
  $('#dots').innerHTML = CONFIG.slides.map(()=>'<i></i>').join('');
}
function showSlide(dir=1, first=false){
  const els = slideEls, cap=$('#cap');
  els.forEach((e,i)=>{ if(i!==slide){ e.classList.remove('on'); if(!first && e.dataset.cur){ e.classList.add('out'); } delete e.dataset.cur; } });
  const el = els[slide];
  el.classList.remove('out');
  if(!first){ el.style.transition='none'; el.style.transform=`translate3d(${6*dir}%,0,0) scale(.97)`; void el.offsetWidth; el.style.transition=''; el.style.transform=''; }
  requestAnimationFrame(()=>{ el.classList.add('on'); el.dataset.cur='1'; });
  els.forEach((e,i)=>{ if(i!==slide) setTimeout(()=>e.classList.remove('out'),600); });
  cap.classList.add('fade');
  setTimeout(()=>{ cap.textContent = CONFIG.slides[slide].text; cap.classList.remove('fade'); },180);
  [...$('#dots').children].forEach((d,i)=>d.classList.toggle('on',i===slide));
  $('#nextPic').textContent = slide===CONFIG.slides.length-1 ? 'TIẾP TỤC ▶' : 'TIẾP THEO ▶';
  clearTimeout(autoT);
  if(slide<CONFIG.slides.length-1) autoT = setTimeout(()=>stepSlide(1,true), 4500);   // tự chuyển ảnh sau 4,5s
}
function stepSlide(dir, auto){
  const n = CONFIG.slides.length;
  if(dir>0){ if(slide>=n-1){ if(!auto) go(6); return; } slide++; }
  else { if(slide<=0) return; slide--; }
  showSlide(dir);
}
function buildFinal(){
  $('#t7').textContent = CONFIG.finalTitle; $('#sub7').textContent = CONFIG.finalSub;
  const c = $('#crowd'); c.innerHTML='';
  CONFIG.students.slice(0,12).forEach((_,i)=>{
    const s=document.createElement('span'); s.textContent=CONFIG.emojis[i%CONFIG.emojis.length];
    s.style.animationDelay=(i*0.1)+'s'; c.appendChild(s);
  });
  const t=document.createElement('span'); t.textContent=CONFIG.teacherEmoji; t.style.fontSize='1.3em'; c.appendChild(t);
}
function burst(){
  const st=$('#stage'), e=['🎉','💖','🌸','✨','🎊','🌷'];
  for(let i=0;i<50;i++){
    const p=document.createElement('div'); p.className='petal'; p.textContent=e[i%e.length];
    p.style.left=Math.random()*100+'%'; p.style.fontSize=(16+Math.random()*16)+'px';
    p.style.setProperty('--dx',(Math.random()*200-100)+'px'); p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    p.style.animationDuration=(3+Math.random()*3)+'s'; p.style.animationDelay=(Math.random()*1.2)+'s';
    st.appendChild(p); setTimeout(()=>p.remove(),7000);
  }
}

/* ===== sự kiện vào từng cảnh ===== */
function onEnter(n){
  timers.splice(0).forEach(clearTimeout);
  if(n===0){
    $('#open').disabled=true; $('#loadtxt').textContent='Đang chuẩn bị món quà nhỏ...';
    const bar=$('.bar i'); bar.style.animation='none'; void bar.offsetWidth; bar.style.animation='';
    timers.push(setTimeout(()=>{ $('#open').disabled=false; $('#loadtxt').textContent='Đã sẵn sàng rồi nè! 💌'; },3100));
  }
  if(n===1) buildRing();
  if(n===2) buildCalendar();
  if(n===3){ $('#gift').classList.remove('open'); $('#openGift').disabled=false; }
  if(n===4) typeLetter();
  document.body.classList.toggle('lite', n===5);
  if(n!==5) clearTimeout(autoT);
  if(n===5){ slide=0; buildSlides(); showSlide(1,true); }
  if(n===6){ buildFinal(); burst(); timers.push(setInterval(burst,6000)); }
}

$('#open').addEventListener('click',()=>{
  $('#flap').style.transform='rotateX(180deg)';
  startMusic();
  setTimeout(()=>go(1),600);
});
$('#openGift').addEventListener('click',e=>{
  e.target.disabled=true; $('#gift').classList.add('open');
  setTimeout(()=>go(4),1500);
});
$('#nextPic').addEventListener('click',()=>stepSlide(1,false));
/* vuốt trái/phải trên khung ảnh để đổi ảnh */
(function(){
  const fr = $('#frame'); let x0=null;
  fr.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true});
  fr.addEventListener('touchend',e=>{
    if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>40) stepSlide(dx<0?1:-1,false);
  },{passive:true});
  fr.addEventListener('click',()=>{ if(slide<CONFIG.slides.length-1) stepSlide(1,false); });
})();
$('#replay').addEventListener('click',()=>{ timers.splice(0).forEach(clearInterval); go(0); });

/* ===== tự co giãn theo màn hình: PC / TV / máy tính bảng thì phóng to, điện thoại giữ nguyên ===== */
function fit(){
  const s = Math.min(3, Math.max(1, Math.min(innerWidth/700, innerHeight/860)));
  document.documentElement.style.setProperty('--s', s.toFixed(3));
}
fit(); addEventListener('resize', fit);

/* ===== khởi động ===== */
$('#t2').textContent = `Các nàng ${CONFIG.className} & ${CONFIG.teacher}`;
$('#sub2').textContent = `${CONFIG.students.length} cô gái • 1 cô giáo • Cùng nhau toả sáng ♡`;
$('#giftNote').textContent = `Thư gửi ${CONFIG.className}`;
if(CONFIG.classPhoto) CONFIG.slides.unshift({ img:CONFIG.classPhoto, text:`Cả lớp ${CONFIG.className} của chúng mình 🌸` });
function startMusic(){
  if(!CONFIG.music) return;
  const a=$('#bgm'); a.src=CONFIG.music; a.volume=.6; a.play().catch(()=>{});
}
go(0);
</script>
